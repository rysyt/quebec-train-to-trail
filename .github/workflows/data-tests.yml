# Data tests on every push (ADR 0006): load the committed GTFS snapshot into PostGIS, then pytest.
name: data tests

on: push

jobs:
  data-tests:
    runs-on: ubuntu-latest
    env:
      # Throwaway credentials: this database lives only for the length of the run.
      POSTGRES_USER: train_to_trail
      POSTGRES_PASSWORD: ci_only
      POSTGRES_DB: train_to_trail
    services:
      db:
        image: postgis/postgis:18-3.6
        # The env context isn't available here, so the values are repeated.
        env:
          POSTGRES_USER: train_to_trail
          POSTGRES_PASSWORD: ci_only
          POSTGRES_DB: train_to_trail
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U train_to_trail"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.23"

      # Spark needs Java 17; the runner's default Java is newer and breaks Spark's Hadoop code.
      - uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        run: uv sync --locked

      # Services start before checkout, so db/init can't be mounted as in compose.yaml.
      - name: Create schemas
        run: psql -h localhost -U "$POSTGRES_USER" -d "$POSTGRES_DB" -v ON_ERROR_STOP=1 -f db/init/20-schemas.sql
        env:
          PGPASSWORD: ${{ env.POSTGRES_PASSWORD }}

      # Ingest skips a download when the file is already in raw/, so it loads the snapshots:
      # the GTFS feed and a small OpenStreetMap cut around Hervey-Jonction. The pipeline then
      # builds staging and runs the data-quality gate.
      - name: Run the pipeline on the test snapshots
        run: |
          mkdir -p raw
          cp tests/data/viarail.zip raw/viarail.zip
          cp tests/data/osm-hervey.osm.pbf raw/quebec-latest.osm.pbf
          uv run python -m quebec_train_to_trail.pipeline

      - name: Run tests
        run: uv run pytest
