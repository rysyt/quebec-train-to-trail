services:
  db:
    image: postgis/postgis:18-3.6
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
      - ./db/init/20-schemas.sql:/docker-entrypoint-initdb.d/20-schemas.sql:ro

  # Run with: docker compose run --rm pipeline
  # The profile keeps "docker compose up -d" to the database only.
  pipeline:
    build: .
    profiles: [pipeline]
    env_file: .env
    environment:
      POSTGRES_HOST: db
    volumes:
      - ./raw:/app/raw  # downloads persist on the host between runs
    depends_on:
      - db

volumes:
  pgdata:
